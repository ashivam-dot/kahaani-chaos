name: run

# F1 "सन्नाटपुर की छोटी एंट्री": two micro-entry Shorts a day, at 13:00 and 19:00 IST (07:30 and 13:30 UTC).
# Production (19:30, 01:30 and 07:30 UTC): plan -> paint (one beat per job, plus up to two repaints of a cast shot) ->
# render, which stores one finished Short as a draft release in the ready buffer (up to 3), then publish schedules the
# next slot with publishAt. The publish-only crons (06:00 and 07:00 UTC for 13:00 IST, 12:00 and 13:15 UTC for 19:00
# IST) fill the slot from the buffer even if production broke. PAUSED=true stops every scheduled run; manual dry runs
# still work.
on:
  schedule:
    - cron: "30 19 * * *"  # production, 01:00 IST (for the 13:00 IST slot)
    - cron: "30 1 * * *"   # production, 07:00 IST
    - cron: "30 7 * * *"   # production, 13:00 IST (refills the buffer when an earlier run held)
    - cron: "0 6 * * *"    # publish only, 11:30 IST
    - cron: "0 7 * * *"    # publish only, 12:30 IST
    - cron: "0 12 * * *"   # publish only, 17:30 IST
    - cron: "15 13 * * *"  # publish only, 18:45 IST
  workflow_dispatch:
    inputs:
      mode:
        description: "dry-run makes one Short and keeps it only as an artifact; publish adds one to the buffer and fills the next slot"
        type: choice
        default: dry-run
        options: [dry-run, publish]
      replay:
        description: "path of a reviewed story in .github/replay/ to paint and render again (no writer calls); in publish mode it is published once"
        type: string
        default: ""

permissions:
  contents: write
  issues: write

# A queued run with the same group cancels the one waiting before it, so a cron must never share a group with a
# manual dry run.
concurrency:
  group: >-
    ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'dry-run' && format('kc-dry-{0}', github.run_id)
    || github.event_name == 'schedule' && (github.event.schedule == '0 6 * * *' || github.event.schedule == '0 7 * * *' || github.event.schedule == '0 12 * * *' || github.event.schedule == '15 13 * * *') && format('kc-slot-{0}', github.run_id)
    || 'kc-produce' }}
  cancel-in-progress: false

env:
  ART_CACHE_KEY: kc-art-zimage-q4k-sd959-v1
  ART_ROOT: /home/runner/.cache/kc-art
  MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.mode || 'publish' }}

jobs:
  plan:
    if: >-
      github.event_name != 'schedule'
      || (github.event.schedule != '0 6 * * *' && github.event.schedule != '0 7 * * *'
          && github.event.schedule != '0 12 * * *' && github.event.schedule != '15 13 * * *' && vars.PAUSED != 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: youtube
    outputs:
      paint: ${{ steps.plan.outputs.paint }}
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - name: Refuse publishing while paused, and replays from outside .github/replay
        env:
          PAUSED: ${{ vars.PAUSED }}
          REPLAY: ${{ inputs.replay }}
        run: |
          if [ "$MODE" != "dry-run" ] && [ "$PAUSED" = "true" ]; then
            echo "PAUSED is true; only dry runs are allowed." >&2
            exit 1
          fi
          case "$REPLAY" in
            ""|.github/replay/*.json) ;;
            *) echo "A replay must be a reviewed story in .github/replay/." >&2; exit 1 ;;
          esac
          case "$REPLAY" in *..*) echo "A replay path may not contain '..'." >&2; exit 1 ;; esac
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: .github/state.sh checkout
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-package torch --no-install-package transformers
      - name: Plan the Short
        id: plan
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          REPLAY: ${{ inputs.replay }}
        run: |
          args=(--out "$RUNNER_TEMP/plan")
          if [ "$MODE" = "dry-run" ]; then args+=(--dry); fi
          if [ -n "$REPLAY" ]; then args+=(--replay "$GITHUB_WORKSPACE/$REPLAY"); fi
          uv run --no-sync python -m kahaani.cli plan "${args[@]}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
          if-no-files-found: ignore
          retention-days: 3
      - name: Is the image model cached?
        id: art-cache
        if: steps.plan.outputs.paint == 'true'
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ART_ROOT }}
          key: ${{ env.ART_CACHE_KEY }}
          lookup-only: true
      - name: Download the image model once
        if: steps.plan.outputs.paint == 'true' && steps.art-cache.outputs.cache-hit != 'true'
        run: python3 -m kahaani.imagegen fetch --root "$ART_ROOT"
      - if: steps.plan.outputs.paint == 'true' && steps.art-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ART_ROOT }}
          key: ${{ env.ART_CACHE_KEY }}

  paint:
    needs: plan
    if: needs.plan.outputs.paint == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    continue-on-error: true
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        beat: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: kahaani
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ env.ART_ROOT }}
          key: ${{ env.ART_CACHE_KEY }}
      - name: Paint one beat (and, while time allows, two repaints of a cast shot for the prop-identity check)
        env:
          BEAT: ${{ matrix.beat }}
        run: >-
          python3 -m kahaani.imagegen beats --prompts "$RUNNER_TEMP/plan/art-plan.json" --only "$BEAT"
          --out "$RUNNER_TEMP/art" --root "$ART_ROOT" --alternates 2 --budget 62
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: art-${{ github.run_id }}-${{ matrix.beat }}
          path: ${{ runner.temp }}/art
          if-no-files-found: ignore
          retention-days: 3

  render:
    needs: [plan, paint]
    if: >-
      always() && !cancelled() && needs.plan.result != 'skipped'
      && (vars.PAUSED != 'true' || github.event_name != 'workflow_dispatch' || inputs.mode == 'dry-run')
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    environment: youtube
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: .github/state.sh checkout
      - name: Free disk for the speech, depth and voice models
        run: sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /opt/hostedtoolcache/CodeQL
      - run: bash .github/scripts/install-media-tools.sh ffmpeg
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: kc-models-${{ hashFiles('uv.lock', 'tts/uv.lock') }}
      - run: uv sync --frozen && uv sync --frozen --project tts
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        continue-on-error: true
        with:
          name: plan-${{ github.run_id }}
          path: ${{ runner.temp }}/plan
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: needs.plan.outputs.paint == 'true'
        continue-on-error: true
        with:
          pattern: art-${{ github.run_id }}-*
          merge-multiple: true
          path: ${{ runner.temp }}/art
      - name: Gate, voice, render and buffer the Short
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--plan "$RUNNER_TEMP/plan" --art "$RUNNER_TEMP/art" --out work)
          if [ "$MODE" = "dry-run" ]; then args+=(--dry); fi
          uv run --no-sync python -m kahaani.cli render "${args[@]}"
      - name: Save state
        if: always() && env.MODE != 'dry-run'
        run: .github/state.sh save "produce ${{ github.run_id }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: short-${{ github.run_id }}
          path: |
            work/*/short.mp4
            work/*/*.json
            work/*/pics/*.jpg
            work/dry-produce-health.json
          if-no-files-found: ignore
          retention-days: 14
      - name: Alert on failure
        if: failure() && env.MODE != 'dry-run'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label alert --state open --search "Production failed" --json number --jq '.[0].number' \
            | grep -q . || gh issue create --label alert --title "Production failed" --body "$RUN_URL"

  publish:
    needs: render
    if: >-
      always() && !cancelled() && vars.PAUSED != 'true'
      && (github.event_name == 'schedule' || inputs.mode == 'publish')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: youtube
    concurrency:
      group: kc-publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - run: .github/state.sh checkout
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - run: uv sync --frozen --no-install-package torch --no-install-package transformers
      - name: Fill the next slot
        env:
          YOUTUBE_OAUTH_JSON: ${{ secrets.YOUTUBE_OAUTH_JSON }}
          KC_CHANNEL_ID: ${{ vars.KC_CHANNEL_ID }}
          KC_PLAYLIST_MICRO: ${{ vars.KC_PLAYLIST_MICRO }}
          GH_TOKEN: ${{ github.token }}
        run: uv run --no-sync python -m kahaani.cli publish
      - name: Save state
        if: always()
        run: .github/state.sh save "publish ${{ github.run_id }}"
      - name: Alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh issue list --label alert --state open --search "Publishing failed" --json number --jq '.[0].number' \
            | grep -q . || gh issue create --label alert --title "Publishing failed" --body "$RUN_URL"
