name: diagnose-voice
on:
  workflow_dispatch:
    inputs:
      replay:
        description: Existing story inside .github/replay; clone-only diagnostic, no publication
        required: true
        type: string
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - run: bash .github/scripts/install-media-tools.sh ffmpeg
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/huggingface
          key: kc-models-${{ hashFiles('uv.lock', 'tts/uv.lock') }}
      - run: uv sync --frozen && uv sync --frozen --project tts
      - name: Reproduce the production clone without another paint or upload
        env:
          REPLAY: ${{ inputs.replay }}
        run: uv run --no-sync python -m tools.diagnose_voice --replay "$REPLAY" --out out/voice
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: voice-diagnosis-${{ github.run_id }}
          path: out/voice
          retention-days: 7
